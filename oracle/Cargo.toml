[package]
name = "oracle"
version = "0.1.0"
edition = "2024"
description = "Invariant oracle: reference model + concurrent workload generator for the stage services"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
